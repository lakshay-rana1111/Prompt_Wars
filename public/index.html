<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Interview Panel App</title>
  <style>
    body{font-family:system-ui;margin:24px;max-width:900px}
    label{display:block;margin-top:12px}
    pre{white-space:pre-wrap;background:#0b0b0b;color:#e6e6e6;padding:12px;border-radius:6px}
    .muted{color:#666;font-size:0.9em}
  </style>
</head>
<body>
  <h1>Interview Panel App (Demo)</h1>
  <p class="muted">Upload the Job Description, two resumes and two transcripts. The server uses Gemini to run 4 independent agents, a debate, and a final decision.</p>

  <form id="upload-form">
    <label>Job Description (PDF or text)<input type="file" name="jobDescription" required></label>
    <label>Resume A (PDF or text)<input type="file" name="resumeA" required></label>
    <label>Transcript A (PDF or text)<input type="file" name="transcriptA" required></label>
    <hr>
    <label>Resume B (PDF or text)<input type="file" name="resumeB" required></label>
    <label>Transcript B (PDF or text)<input type="file" name="transcriptB" required></label>

    <button type="submit">Analyze</button>
  </form>

  <h2>Status</h2>
  <div id="status">Idle</div>

  <h2>Result</h2>
  <pre id="result">No result yet.</pre>

  <script src="/app.js"></script>
</body>
</html>
